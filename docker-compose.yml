services:
  mindmap-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: mindmap-api
    container_name: mindmap-api
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3100
      - APP_URL=${APP_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    restart: unless-stopped

  mindmap-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mindmap-web
    container_name: mindmap-web
    ports:
      - "${WEB_PORT:-8090}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mindmap-api
    restart: unless-stopped
